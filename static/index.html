<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>海上搜救协调</title>
<style>body{font:15px/1.6 system-ui,sans-serif;max-width:1100px;margin:30px auto;padding:0 20px;color:#17324d}table{border-collapse:collapse;width:100%;margin:16px 0}th,td{border:1px solid #cbd8e3;padding:8px;text-align:left}th{background:#edf5fb}code{background:#f2f5f7;padding:2px 5px}.card{background:#f7fbfe;border-left:5px solid #2784c7;padding:12px 16px}</style>
<h1>海上搜救协调</h1><div class="card">页面读取实时状态。业务写入通过 README 中的 JSON API 完成，并需要 <code>X-User</code>、<code>X-Role</code>。<a href="/api/export">导出 JSON</a> 与本页、时间线使用同一版本依据。</div>
<h2>遇险事件</h2><table id="incidents"><thead><tr><th>编号</th><th>船名</th><th>状态</th><th>海况</th><th>负责机构</th><th>版本</th></tr></thead><tbody></tbody></table>
<h2>资源</h2><table id="assets"><thead><tr><th>名称</th><th>类型</th><th>状态</th><th>航程</th><th>版本</th></tr></thead><tbody></tbody></table>
<h2>搜索区域</h2><table id="areas"><thead><tr><th>编号</th><th>事件</th><th>状态</th><th>优先级</th><th>资源</th><th>版本</th></tr></thead><tbody></tbody></table>
<h2>派遣任务</h2><table id="assignments"><thead><tr><th>ID</th><th>区域</th><th>资源</th><th>状态</th><th>下达依据</th><th>出发时间</th></tr></thead><tbody></tbody></table>
<h2>候选冲突</h2><table id="candidates"><thead><tr><th>ID</th><th>区域</th><th>资源</th><th>状态</th><th>冲突</th></tr></thead><tbody></tbody></table>
<h2>时间线</h2><ol id="timeline"></ol>
<script>async function load(){const d=await fetch('/api/state').then(r=>r.json());const fill=(id,rows,cols)=>{document.querySelector('#'+id+' tbody').innerHTML=rows.map(r=>'<tr>'+cols.map(c=>`<td>${r[c]??''}</td>`).join('')+'</tr>').join('')};fill('incidents',d.incidents,['code','vessel_name','status','sea_state','lead_org','version']);fill('assets',d.assets,['name','kind','status','range_km','version']);fill('areas',d.search_areas,['code','incident_id','status','priority','assigned_asset_id','version']);const basis=a=>{const b=a.basis||{};return`资源v${b.asset_version} 区域v${b.area_version} 海况${b.sea_state} 距离${b.distance_km}km`};fill('assignments',d.assignments.map(a=>({...a,basis_desc:basis(a)})),['id','area_id','asset_id','status','basis_desc','departed_at']);fill('candidates',d.candidates.map(c=>({...c,conflict_desc:(c.conflicts||[]).join('；')})),['id','area_id','asset_id','status','conflict_desc']);document.querySelector('#timeline').innerHTML=d.timeline.slice(0,20).map(x=>`<li>${x.created_at} ${x.action} ${x.details}</li>`).join('')}load()</script></html>
